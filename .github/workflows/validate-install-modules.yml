name: Validate install modules

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-install-modules:
    name: Validate install module manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate install module manifest and skill paths
        run: node tools/validate-install-modules.mjs
